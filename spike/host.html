<!doctype html>
<meta charset="utf-8">
<title>Anfitriao</title>
<style>
  body { margin:0; height:56px; display:flex; gap:8px; align-items:center; padding:0 10px;
         font:13px system-ui; background:#1e1f22; color:#ddd; overflow:hidden }
  input { flex:1; padding:6px 8px; background:#111; color:#eee; border:1px solid #444; border-radius:4px }
  button { padding:6px 12px; cursor:pointer }
  #st { font-size:11px; color:#8a8; max-width:260px; overflow:hidden; white-space:nowrap }
</style>
<input id="url" value="https://www.youtube.com">
<button id="go">Ir</button>
<select id="quality" title="Qualidade do stream">
  <option value="1080-60">1080p 60fps</option>
  <option value="720-30">720p 30fps</option>
  <option value="720-60">720p 60fps</option>
</select>
<button id="share">Compartilhar aba</button>
<span id="st">...</span>
<script>
  const $ = (id) => document.getElementById(id);
  $('go').onclick = () => bridge.navigate($('url').value);
  $('url').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
  bridge.onStatus((s) => { $('st').textContent = s.join(' | '); $('st').title = s.join('\n'); });

  const QUALITY = {
    '1080-60': { width: 1920, height: 1080, frameRate: 60 },
    '720-30':  { width: 1280, height: 720,  frameRate: 30 },
    '720-60':  { width: 1280, height: 720,  frameRate: 60 },
  };

  let pc;
  $('share').onclick = async () => {
    const q = QUALITY[$('quality').value];
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: q, audio: true });
    console.log('tracks', stream.getTracks().map(t => t.kind + ':' + t.label));
    $('st').textContent = 'compartilhando: ' + stream.getTracks().map(t => t.kind).join('+');
    // favor fps sobre resolucao sob pressao de banda
    stream.getVideoTracks()[0].contentHint = 'motion';
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    stream.getTracks().forEach((t) => pc.addTrack(t, stream));
    pc.onicecandidate = (e) => e.candidate && bridge.signal({ ice: e.candidate.toJSON() });
    // data channel criado pelo ofertante (host) — JSEP exige que o ofertante crie
    const dc = pc.createDataChannel('remote-control');
    dc.onmessage = (ev) => bridge.remoteControl(JSON.parse(ev.data));
    // Bitrate pre-negociacao (pode falhar; re-aplica apos answer)
    const sender = pc.getSenders().find((s) => s.track && s.track.kind === 'video');
    try {
      const p = sender.getParameters();
      if (p.encodings.length > 0) {
        p.encodings[0].maxBitrate = 6_000_000;
        p.encodings[0].maxFramerate = 60;
        await sender.setParameters(p);
        console.log('bitrate cap: aplicado pre-negociacao');
      }
    } catch (e) { console.log('bitrate cap pre-negociacao falhou:', e.message); }
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    bridge.signal({ sdp: pc.localDescription.toJSON() });
  };
  bridge.onSignal(async (m) => {
    if (m.sdp && pc) {
      await pc.setRemoteDescription(m.sdp);
      // Re-aplica bitrate apos negociacao SDP quando encodings ja existem
      const sender = pc.getSenders().find((s) => s.track && s.track.kind === 'video');
      if (sender) {
        try {
          const p = sender.getParameters();
          if (p.encodings.length > 0) {
            p.encodings[0].maxBitrate = 6_000_000;
            p.encodings[0].maxFramerate = 60;
            await sender.setParameters(p);
            console.log('bitrate cap: aplicado pos-negociacao');
          }
        } catch (e) { console.log('bitrate cap pos-negociacao falhou:', e.message); }
      }
    }
    if (m.ice && pc) await pc.addIceCandidate(m.ice);
  });
</script>
