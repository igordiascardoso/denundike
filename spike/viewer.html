<!doctype html>
<meta charset="utf-8">
<title>Convidado</title>
<style>
  body { margin:0; background:#000; color:#ddd; font:13px system-ui; display:flex; flex-direction:column; height:100vh }
  video { flex:1; min-height:0; width:100%; background:#000 }
  #bar { padding:6px 10px; background:#1e1f22; display:flex; gap:14px; align-items:center }
  #stats { font:12px ui-monospace,monospace; color:#9c9 }
</style>
<video id="v" autoplay playsinline muted></video>
<div id="bar">
  <label><input type="checkbox" id="mute" checked> mudo (evita eco no mesmo PC)</label>
  <span id="stats">aguardando anfitriao...</span>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  $('mute').onchange = () => { $('v').muted = $('mute').checked; };
  // Controle remoto: encaminha cliques e teclas para o host via data channel
  let dc;
  function sendRemoteEvent(payload) {
    if (dc && dc.readyState === 'open') dc.send(JSON.stringify(payload));
  }
  // Coordenadas corrigidas para letterboxing (object-fit: contain)
  function videoCoords(e) {
    const v = $('v'), r = v.getBoundingClientRect();
    if (!v.videoWidth || !v.videoHeight) return null;
    const s = Math.min(r.width / v.videoWidth, r.height / v.videoHeight);
    const w = v.videoWidth * s, h = v.videoHeight * s;
    const ox = r.left + (r.width - w) / 2, oy = r.top + (r.height - h) / 2;
    const x = (e.clientX - ox) / w, y = (e.clientY - oy) / h;
    return (x >= 0 && x <= 1 && y >= 0 && y <= 1) ? { x, y } : null;
  }
  $('v').addEventListener('click', (e) => {
    const c = videoCoords(e); if (c) sendRemoteEvent({ type: 'click', ...c });
  });
  $('v').addEventListener('mousemove', (e) => {
    const c = videoCoords(e); if (c) sendRemoteEvent({ type: 'move', ...c });
  });
  document.addEventListener('keydown', (e) => {
    if (document.activeElement === document.body)
      sendRemoteEvent({ type: 'key', key: e.key, code: e.code, keyCode: e.keyCode, modifiers: { shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey } });
  });

  let pc;
  bridge.onSignal(async (m) => {
    if (m.sdp) {
      pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      pc.onicecandidate = (e) => e.candidate && bridge.signal({ ice: e.candidate.toJSON() });
      pc.ontrack = (e) => { $('v').srcObject = e.streams[0]; };
      // data channel criado pelo host; aguarda aqui
      pc.ondatachannel = (e) => { dc = e.channel; };
      await pc.setRemoteDescription(m.sdp);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      bridge.signal({ sdp: pc.localDescription.toJSON() });
      startStats();
    }
    if (m.ice && pc) await pc.addIceCandidate(m.ice);
  });

  function startStats() {
    let lastBytes = 0, lastT = 0;
    setInterval(async () => {
      const rep = await pc.getStats();
      let out = '';
      rep.forEach((r) => {
        if (r.type === 'inbound-rtp' && r.kind === 'video') {
          const dt = (r.timestamp - lastT) / 1000;
          const mbps = lastT ? ((r.bytesReceived - lastBytes) * 8 / dt / 1e6).toFixed(2) : '-';
          lastBytes = r.bytesReceived; lastT = r.timestamp;
          out += `video ${r.frameWidth}x${r.frameHeight} ${Math.round(r.framesPerSecond || 0)}fps ${mbps}Mbps perdidos=${r.packetsLost} `;
        }
        if (r.type === 'inbound-rtp' && r.kind === 'audio') out += `| audio ok (${r.packetsReceived} pkts)`;
      });
      $('stats').textContent = out || 'sem dados';
    }, 1000);
  }
</script>
