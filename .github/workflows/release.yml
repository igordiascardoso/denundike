name: Release

on:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: client
      - run: npm run build:linux
        working-directory: client
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
